<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이터리고?</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        /* 페이퍼로지(Paperlogy) 웹 폰트 연동 */
        @font-face {
            font-family: 'Paperlogy';
            src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/2411@1.0/Paperlogy-Medium.woff2') format('woff2');
            font-weight: 500;
            font-style: normal;
        }
        @font-face {
            font-family: 'Paperlogy';
            src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/2411@1.0/Paperlogy-Bold.woff2') format('woff2');
            font-weight: 700;
            font-style: normal;
        }

        :root {
            --main-bg-color: #1a1b20;
            --btn-bg-color: #ff9800;
            --btn-hover-color: #e68a00;
            --text-color: #ffffff;
            --input-font-size: 16px;
            --input-font-color: #ffffff;
            --textarea-font-size: 14px;
        }

        body {
            background-color: var(--main-bg-color);
            font-family: 'Paperlogy', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-color);
        }

        h1 {
            font-weight: 700;
            font-size: 28px;
            margin-bottom: 20px;
            color: #ffb74d;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        /* 상단 컨트롤 영역 (스킨 선택 드롭다운 + 다운로드 버튼) */
        .control-panel {
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
            background: #2c2d38;
            padding: 15px 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .skin-select {
            font-family: 'Paperlogy', sans-serif;
            padding: 10px;
            font-size: 16px;
            background-color: #1a1b20;
            color: white;
            border: 1px solid #ff9800;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn {
            font-family: 'Paperlogy', sans-serif;
            background-color: var(--btn-bg-color);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: var(--btn-hover-color);
        }

        /* 캡처 및 이미지 배경 영역 */
        #capture-area {
            position: relative;
            width: 800px; 
            height: 500px; 
            background-color: #2c2d38;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        /* 하단에 숨겨진 실제 배경 이미지 객체 */
        #bg-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        /* 입력 폼 컨테이너 (이미지보다 위에 오도록 z-index 설정) */
        .input-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none; /* 컨테이너 자체는 클릭 무시 */
        }

        /* 공통 입력창 스타일 */
        .profile-input {
            position: absolute;
            background: transparent;
            border: none;
            outline: none;
            color: var(--input-font-color);
            font-size: var(--input-font-size);
            font-family: 'Paperlogy', sans-serif;
            font-weight: 500;
            padding: 4px;
            box-sizing: border-box;
            pointer-events: auto; /* 입력창은 클릭 가능하게 */
        }

        textarea.profile-input {
            resize: none;
            font-size: var(--textarea-font-size);
            line-height: 1.5;
        }

        .profile-input:focus {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 4px;
        }

        /* ========================================================
           [위치 조정 구역] 트친소표 레이아웃에 맞게 수정하세요.
           ======================================================== */
        .field-game-type { top: 50px; left: 50px; width: 200px; }
        .field-ingame-name { top: 100px; left: 50px; width: 200px; }
        .field-communication { top: 150px; left: 50px; width: 200px; }
        .field-tier { top: 200px; left: 50px; width: 200px; }
        .field-twitter-name { top: 40px; left: 300px; width: 200px; text-align: center; }
        .field-info { top: 280px; left: 300px; width: 200px; text-align: center; }
        .field-play-style { top: 50px; left: 550px; width: 200px; }
        .field-avoid { top: 100px; left: 550px; width: 200px; }
        .field-time { top: 150px; left: 550px; width: 200px; }
        .field-introduction { top: 330px; left: 200px; width: 400px; height: 120px; }
    </style>
</head>
<body>

    <h1>이터리고?</h1>

    <div class="control-panel">
        <label for="skin-select">🎨 캐릭터 스킨 선택: </label>
        <select id="skin-select" class="skin-select" onchange="changeBackground(this.value)"></select>

        <button class="btn" onclick="downloadProfile()">💾 트친소 이미지 다운로드</button>
    </div>

    <div id="capture-area">
        <img id="bg-image" src="" crossOrigin="anonymous" alt="배경">
        
        <div class="input-container">
            <input type="text" class="profile-input field-game-type" placeholder="일반 / 랭크 / 코발트">
            <input type="text" class="profile-input field-ingame-name" placeholder="인게임 닉네임">
            <input type="text" class="profile-input field-communication" placeholder="듣기 / 말하기 / 전부">
            <input type="text" class="profile-input field-tier" placeholder="현재 티어">
            
            <input type="text" class="profile-input field-twitter-name" placeholder="트위터 닉네임">
            <input type="text" class="profile-input field-info" placeholder="성별 / 나이">
            
            <input type="text" class="profile-input field-play-style" placeholder="연성 / 소비 / 흔적 / 일상">
            <input type="text" class="profile-input field-avoid" placeholder="블락 / 블언블 / 언팔">
            <input type="text" class="profile-input field-time" placeholder="주요 접속 시간대">
            
            <textarea class="profile-input field-introduction" placeholder="소개글이나 작업 성향 등을 자유롭게 작성하세요."></textarea>
        </div>
    </div>

    <script>
        // ========================================================
        // 📦 [스킨 데이터 리스트]여기에 파이어베이스 주소를 편하게 추가하세요!
        // ========================================================
        const skinList = [
            { name: "기본 배경 양식", url: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=800" },
            { name: "반항아 리다이린", url: "파이어베이스_반항아_리다이린_주소" },
            { name: "용다이린", url: "파이어베이스_용다이린_주소" },
            { name: "퍼펙트 딜리버리 실비아", url: "파이어베이스_실비아_주소" },
            { name: "데비 & 마를렌", url: "파이어베이스_데비마를렌_주소" }
        ];

        // 페이지 로드 시 드롭다운 메뉴 자동 생성 및 초기 배경 설정
        window.addEventListener('DOMContentLoaded', () => {
            const selectEl = document.getElementById('skin-select');
            
            skinList.forEach(skin => {
                const option = document.createElement('option');
                option.value = skin.url;
                option.textContent = skin.name;
                selectEl.appendChild(option);
            });

            if(skinList.length > 0) {
                changeBackground(skinList[0].url);
            }
        });

        // 드롭다운 선택 시 배경 이미지 교체
        function changeBackground(imageUrl) {
            const bgImage = document.getElementById('bg-image');
            bgImage.src = imageUrl;
        }

        // 이미지 다운로드 함수
        function downloadProfile() {
            const captureArea = document.getElementById('capture-area');
            const inputs = captureArea.querySelectorAll('.profile-input');
            const placeholders = [];
            
            // 캡처 시 placeholder 문자열 숨기기
            inputs.forEach((input, index) => {
                placeholders[index] = input.placeholder;
                input.placeholder = '';
            });

            html2canvas(captureArea, { scale: 2, useCORS: true, allowTaint: false }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'er_profile.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
                
                // placeholder 다시 복구
                inputs.forEach((input, index) => {
                    input.placeholder = placeholders[index];
                });
            }).catch(error => {
                console.error('이미지 생성 실패:', error);
                inputs.forEach((input, index) => {
                    input.placeholder = placeholders[index];
                });
            });
        }
    </script>
</body>
</html>
