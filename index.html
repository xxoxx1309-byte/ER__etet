<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이터리고?</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        /* ⭕ 제공해주신 페이퍼로지 웹폰트 세팅 반영 */
        @font-face {
            font-family: 'Paperozi';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-1Thin.woff2') format('woff2');
            font-weight: 100;
            font-display: swap;
        }
        @font-face {
            font-family: 'Paperozi';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-2ExtraLight.woff2') format('woff2');
            font-weight: 200;
            font-display: swap;
        }
        @font-face {
            font-family: 'Paperozi';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-3Light.woff2') format('woff2');
            font-weight: 300;
            font-display: swap;
        }
        @font-face {
            font-family: 'Paperozi';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-4Regular.woff2') format('woff2');
            font-weight: 400;
            font-display: swap;
        }
        @font-face {
            font-family: 'Paperozi';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-5Medium.woff2') format('woff2');
            font-weight: 500;
            font-display: swap;
        }
        @font-face {
            font-family: 'Paperozi';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-6SemiBold.woff2') format('woff2');
            font-weight: 600;
            font-display: swap;
        }
        @font-face {
            font-family: 'Paperozi';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-7Bold.woff2') format('woff2');
            font-weight: 700;
            font-display: swap;
        }
        @font-face {
            font-family: 'Paperozi';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-8ExtraBold.woff2') format('woff2');
            font-weight: 800;
            font-display: swap;
        }
        @font-face {
            font-family: 'Paperozi';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-9Black.woff2') format('woff2');
            font-weight: 900;
            font-display: swap;
        }

        :root {
            --main-bg-color: #1a1b20;
            --btn-bg-color: #ff9800;
            --btn-hover-color: #e68a00;
            --text-color: #ffffff;
            --font-main: 'Paperozi', sans-serif;
            
            /* 선택 시 들어올 이펙트 색상 (디자인에 맞게 변경 가능) */
            --select-active-color: #00ffcc; 
            --select-inactive-color: rgba(255, 255, 255, 0.4);
        }

        body {
            background-color: var(--main-bg-color);
            font-family: var(--font-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-color);
        }

        h1 {
            font-weight: 700;
            font-size: 28px;
            margin-bottom: 20px;
            color: #ffb74d;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .control-panel {
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
            background: #2c2d38;
            padding: 15px 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .skin-select {
            font-family: var(--font-main);
            padding: 10px;
            font-size: 16px;
            background-color: #1a1b20;
            color: white;
            border: 1px solid #ff9800;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn {
            font-family: var(--font-main);
            background-color: var(--btn-bg-color);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: var(--btn-hover-color);
        }

        /* 캡처 및 이미지 배경 영역 */
        #capture-area {
            position: relative;
            width: 900px; /* 기능 증가에 따라 조정한 임시 가로 해상도 */
            height: 600px; 
            background-color: #2c2d38;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        #bg-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        .input-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        /* 공통 텍스트 인풋 입력창 스타일 */
        .profile-text-input {
            position: absolute;
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 16px;
            font-family: var(--font-main);
            font-weight: 500;
            padding: 4px;
            box-sizing: border-box;
            pointer-events: auto;
        }
        .profile-text-input:focus {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 4px;
        }

        textarea.profile-text-input {
            resize: none;
            line-height: 1.5;
        }

        /* 선택형 버튼 공통 그룹 및 요소 스타일 */
        .toggle-group {
            position: absolute;
            display: flex;
            gap: 10px;
            pointer-events: auto;
        }

        .toggle-item {
            font-family: var(--font-main);
            font-weight: 600;
            font-size: 14px;
            color: var(--select-inactive-color);
            cursor: pointer;
            user-select: none;
            transition: color 0.2s, text-shadow 0.2s;
        }

        /* 활성화 시 색상 변경 및 네온 효과 */
        .toggle-item.active {
            color: var(--select-active-color);
            text-shadow: 0 0 8px var(--select-active-color);
        }

        /* 티어 컨테이너 구성 */
        .tier-container {
            position: absolute;
            display: flex;
            align-items: center;
            gap: 8px;
            pointer-events: auto;
        }
        .tier-select {
            font-family: var(--font-main);
            background: rgba(0, 0, 0, 0.6);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 4px;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
        }
        .tier-icon {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }

        /* 중앙 이미지 직접 업로드 영역 */
        .upload-zone {
            position: absolute;
            border: 2px dashed rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.2);
            pointer-events: auto;
            transition: background 0.2s;
        }
        .upload-zone:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        .upload-zone img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .upload-zone span {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
            text-align: center;
            padding: 10px;
        }
        .file-hidden {
            display: none;
        }

        /* ========================================================
           [위치 조정 구역] 배경 레이아웃 디자인에 따라 자유롭게 변경
           ======================================================== */
        .field-game-type { top: 60px; left: 50px; }            /* 게임 성향 토글 그룹 */
        .field-ingame-name { top: 110px; left: 50px; width: 200px; } /* 닉네임 텍스트 입력 */
        .field-communication { top: 160px; left: 50px; }        /* 소통 방식 토글 그룹 */
        .field-tier-box { top: 210px; left: 50px; }             /* 티어 드롭다운 존 */
        
        .field-twitter-name { top: 40px; left: 350px; width: 200px; text-align: center; }
        .field-info { top: 290px; left: 350px; width: 200px; text-align: center; }
        
        .field-play-style { top: 60px; left: 600px; }           /* 플레이 성향 토글 그룹 */
        .field-play-etc { top: 95px; left: 600px; width: 180px; border-bottom: 1px solid rgba(255,255,255,0.4); font-size:13px; } /* 플레이 기타 인풋 */
        .field-avoid { top: 140px; left: 600px; }               /* 지뢰 성향 토글 그룹 */
        .field-time { top: 190px; left: 600px; width: 200px; }
        .field-introduction { top: 350px; left: 250px; width: 400px; height: 100px; }

        /* 중앙 파일 업로드 상자 위치 */
        .field-user-upload { top: 120px; left: 375px; width: 150px; height: 150px; }
    </style>
</head>
<body>

    <h1>이터리고?</h1>

    <div class="control-panel">
        <label for="skin-select">🎨 캐릭터 스킨 선택: </label>
        <select id="skin-select" class="skin-select" onchange="changeBackground(this.value)"></select>

        <button class="btn" onclick="downloadProfile()">💾 트친소 이미지 다운로드</button>
    </div>

    <div id="capture-area">
        <img id="bg-image" src="" crossOrigin="anonymous" alt="배경">
        
        <div class="input-container">
            
            <div class="toggle-group field-game-type">
                <span class="toggle-item" onclick="toggleActive(this)">일반</span>
                <span class="toggle-item" onclick="toggleActive(this)">랭크</span>
                <span class="toggle-item" onclick="toggleActive(this)">코발트</span>
                <span class="toggle-item" onclick="toggleActive(this)">내전</span>
            </div>

            <input type="text" class="profile-text-input field-ingame-name" placeholder="인게임 닉네임">
            
            <div class="toggle-group field-communication">
                <span class="toggle-item" onclick="toggleActive(this)">듣기</span>
                <span class="toggle-item" onclick="toggleActive(this)">말하기</span>
                <span class="toggle-item" onclick="toggleActive(this)">전부</span>
                <span class="toggle-item" onclick="toggleActive(this)">미사용</span>
            </div>

            <div class="tier-container field-tier-box">
                <select id="tier-select" class="tier-select" onchange="changeTierIcon(this.value)">
                    <option value="unrank">언랭크</option>
                    <option value="iron">아이언</option>
                    <option value="bronze">브론즈</option>
                    <option value="silver">실버</option>
                    <option value="gold">골드</option>
                    <option value="platinum">플래티넘</option>
                    <option value="diamond">다이아몬드</option>
                    <option value="meteorite">메테오라이트</option>
                    <option value="mithril">미스릴</option>
                    <option value="demigod">데미갓</option>
                    <option value="eternity">이터니티</option>
                </select>
                <img id="tier-icon-img" class="tier-icon" src="" crossOrigin="anonymous" alt="" style="display: none;">
            </div>
            
            <input type="text" class="profile-text-input field-twitter-name" placeholder="트위터 닉네임">
            <input type="text" class="profile-text-input field-info" placeholder="성별 / 나이">
            
            <div class="toggle-group field-play-style">
                <span class="toggle-item" onclick="toggleActive(this)">연성</span>
                <span class="toggle-item" onclick="toggleActive(this)">소비</span>
                <span class="toggle-item" onclick="toggleActive(this)">흔적</span>
                <span class="toggle-item" onclick="toggleActive(this)">일상</span>
            </div>
            <input type="text" class="profile-text-input field-play-etc" placeholder="기타 직접 입력...">

            <div class="toggle-group field-avoid">
                <span class="toggle-item" onclick="toggleActive(this)">블락</span>
                <span class="toggle-item" onclick="toggleActive(this)">블언블</span>
                <span class="toggle-item" onclick="toggleActive(this)">언팔</span>
            </div>

            <input type="text" class="profile-text-input field-time" placeholder="주요 접속 시간대">
            <textarea class="profile-text-input field-introduction" placeholder="소개글을 자유롭게 작성하세요."></textarea>

            <div class="upload-zone field-user-upload" onclick="triggerUpload()">
                <span id="upload-placeholder">클릭하여 프로필<br>사진 업로드</span>
                <img id="preview-img" style="display: none;" alt="프로필 사진">
            </div>
            <input type="file" id="user-file-input" class="file-hidden" accept="image/*" onchange="handleFile(this)">

        </div>
    </div>

    <script>
        // ========================================================
        // 📦 [스킨 데이터 리스트] 파이어베이스 스토리지 주소 연동 구역
        // ========================================================
        const skinList = [
            { name: "기본 배경 양식", url: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=800" },
            { name: "반항아 리다이린", url: "파이어베이스_반항아_리다이린_주소" },
            { name: "용다이린", url: "파이어베이스_용다이린_주소" },
            { name: "퍼펙트 딜리버리 실비아", url: "파이어베이스_실비아_주소" },
            { name: "데비 & 마를렌", url: "파이어베이스_데비마를렌_주소" }
        ];

        // ========================================================
        // 🛡️ [티어 아이콘 매칭 테이블] 파이어베이스 스토리지 이미지 주소를 연결하세요!
        // ========================================================
        const tierImages = {
            unrank: "파베_언랭크_아이콘_주소",
            iron: "파베_아이언_아이콘_주소",
            bronze: "파베_브론즈_아이콘_주소",
            silver: "파베_실버_아이콘_주소",
            gold: "파베_골드_아이콘_주소",
            platinum: "파베_플래티넘_아이콘_주소",
            diamond: "파베_다이아몬드_아이콘_주소",
            meteorite: "파베_메테오라이트_아이콘_주소",
            mithril: "파베_미스릴_아이콘_주소",
            demigod: "파베_데미갓_아이콘_주소",
            eternity: "파베_이터니티_아이콘_주소"
        };

        // 초기 빌드 및 메뉴 렌더링
        window.addEventListener('DOMContentLoaded', () => {
            const selectEl = document.getElementById('skin-select');
            skinList.forEach(skin => {
                const option = document.createElement('option');
                option.value = skin.url;
                option.textContent = skin.name;
                selectEl.appendChild(option);
            });

            if(skinList.length > 0) changeBackground(skinList[0].url);
            
            // 첫 티어 기본 이미지 호출
            changeTierIcon(document.getElementById('tier-select').value);
        });

        function changeBackground(imageUrl) {
            document.getElementById('bg-image').src = imageUrl;
        }

        // 클릭 성향 선택 및 색상 변경 토글 스크립트
        function toggleActive(element) {
            element.classList.toggle('active');
        }

        // 티어 드롭다운 변경 시 아이콘 변경 스크립트
        function changeTierIcon(tierKey) {
            const imgEl = document.getElementById('tier-icon-img');
            const url = tierImages[tierKey];
            
            if(url && !url.includes("파베_")) {
                imgEl.src = url;
                imgEl.style.display = "block";
            } else {
                imgEl.style.display = "none"; // 주소가 연결되지 않았을 땐 미표시
            }
        }

        // 유저 로컬 이미지 수동 업로드 컨트롤
        function triggerUpload() {
            document.getElementById('user-file-input').click();
        }

        function handleFile(input) {
            const file = input.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('upload-placeholder').style.display = 'none';
                    const preview = document.getElementById('preview-img');
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                }
                reader.readAsDataURL(file);
            }
        }

        // 전체 캡처 및 저장 기능
        function downloadProfile() {
            const captureArea = document.getElementById('capture-area');
            const inputs = captureArea.querySelectorAll('.profile-text-input');
            const tierSelect = document.getElementById('tier-select');
            const placeholders = [];
            
            // 캡처 시 가이드를 위한 텍스트 및 기본 테두리 잠시 숨김
            inputs.forEach((input, index) => {
                placeholders[index] = input.placeholder;
                input.placeholder = '';
            });
            tierSelect.style.opacity = "0"; // 캡처본에는 드롭다운 테두리 숨기기

            html2canvas(captureArea, { scale: 2, useCORS: true, allowTaint: false }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'er_profile.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
                
                // 복구
                inputs.forEach((input, index) => {
                    input.placeholder = placeholders[index];
                });
                tierSelect.style.opacity = "1";
            }).catch(error => {
                console.error('이미지 생성 실패:', error);
                inputs.forEach((input, index) => {
                    input.placeholder = placeholders[index];
                });
                tierSelect.style.opacity = "1";
            });
        }
    </script>
</body>
</html>
